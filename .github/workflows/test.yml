# Run shared checks and container smoke tests on push.
on: [push]
name: Run tests
jobs:
  # Share setup for static checks, runtime tests, coverage, and source integrity.
  check:
    name: "check: ${{matrix.os}}"
    runs-on: "${{matrix.os}}"
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: x
    steps:
      - name: Turn off git core.autocrlf
        if: matrix.os == 'windows-latest'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: "go install necessary tools"
        if: always()
        run: |
          go install github.com/maruel/pat/cmd/ba@v0.0.4
      - name: "Check: go test -cover (full)"
        # Only run costly tests on linux.
        if: matrix.os == 'ubuntu-latest'
        env:
          # Make sure we don't get throttled calling github apis.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make test
      - name: "Check: go test -cover (light)"
        if: matrix.os == 'windows-latest' || matrix.os == 'macos-latest'
        env:
          # Make sure we don't get throttled calling github apis.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make test
        # Don't send code coverage if anything failed to reduce spam.
      - uses: codecov/codecov-action@v7
        with:
          token: ${{secrets.CODECOV_TOKEN}}
      - name: "Cleanup"
        if: always()
        run: rm -f coverage.txt codecov codecov.*
      - name: "Check: tree is clean"
        if: always()
        run: |
          # Nothing should have changed in the tree up to that point and no
          # unsuspected file was created.
          TOUCHED=$(git status --porcelain)
          if ! test -z "$TOUCHED"; then
            echo "Oops, something touched these files, please cleanup:"
            echo "$TOUCHED"
            git diff
            false
          fi
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: always() && runner.os == 'Linux'
      - run: make verify
        if: always() && runner.os == 'Linux'
      - name: "Check: go generate doesn't modify files"
        if: always()
        run: |
          go generate ./...
          # Also test for untracked files.
          TOUCHED=$(git status --porcelain)
          if ! test -z "$TOUCHED"; then
            echo "go generate created these files, please fix:"
            echo "$TOUCHED"
            false
          fi
      - name: "Check: go mod tidy doesn't modify files"
        if: always()
        run: |
          go mod tidy
          TOUCHED=$(git status --porcelain)
          if ! test -z "$TOUCHED"; then
            echo "go mod tidy was not clean, please update:"
            git diff
            false
          fi

  # Runs the smoke test (end-to-end container lifecycle) with code coverage.
  smoke:
    name: "smoke: ${{matrix.runtime}} on ubuntu-latest"
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      # Run Docker and Podman on separate runners. They use separate image
      # stores and unpack large base images; sharing one runner can exhaust
      # /mnt even though both stores are relocated there.
      matrix:
        runtime: [docker, podman]
    env:
      PYTHONDONTWRITEBYTECODE: x
    steps:
      - name: Maximize Docker/Podman Space
        run: |
          sudo systemctl stop docker.service docker.socket containerd.service
          sudo rm -rf /var/lib/docker
          sudo mkdir -p /mnt/docker
          sudo ln -s /mnt/docker /var/lib/docker
          sudo systemctl start containerd.service docker.service
          sudo mkdir -p /mnt/user-containers
          sudo chown "$USER:$USER" /mnt/user-containers
          sudo mkdir -p /mnt/go-test-tmp
          sudo chown "$USER:$USER" /mnt/go-test-tmp
          mkdir -p ~/.local/share
          ln -s /mnt/user-containers ~/.local/share/containers
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: "Check: go test -tags=smoke (short)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TMPDIR: /mnt/go-test-tmp
        run: go test -tags=smoke -run 'TestSmoke/${{matrix.runtime}}$' -short -v -timeout 30m -covermode=count -coverprofile coverage_smoke.txt
      - uses: codecov/codecov-action@v7
        with:
          token: ${{secrets.CODECOV_TOKEN}}
          files: coverage_smoke.txt
          flags: smoke,smoke-${{matrix.runtime}}

  codeql:
    name: "codeql: ${{matrix.os}}"
    runs-on: "${{matrix.os}}"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: github/codeql-action/init@v4
        with:
          languages: go
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
